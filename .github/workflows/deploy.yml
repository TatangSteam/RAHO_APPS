name: Deploy RAHO_APPS

on:
  push:
    branches:
      - test
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '**.example'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, test-erp-runner]
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          clean: true
          fetch-depth: 1
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.1
          cache: npm

      - name: Verify lockfiles
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"

          # Deployment must never create and push a second commit. If an app
          # lockfile is stale, fail and require the correction in a reviewed
          # commit instead.
          (cd apps/api && npm install --package-lock-only --ignore-scripts --no-workspaces)
          (cd apps/web && npm install --package-lock-only --ignore-scripts --no-workspaces)
          git diff --exit-code -- apps/api/package-lock.json apps/web/package-lock.json

      - name: Install dependencies and run tests
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"

          npm ci

          # A clean runner only has Prisma's placeholder client after npm ci.
          # Generate the schema-specific client before Jest, lint, and tsc load it.
          npm run db:generate --prefix apps/api
          npm run test:api
          npm run test:web
          npm run lint --prefix apps/api
          npm run lint --prefix apps/web
          npm run type-check:all

      - name: Verify and populate production secrets
        shell: bash
        env:
          # 1. Map GitHub Repository Secrets to environment variables
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ICD_API_CLIENT_ID: ${{ secrets.ICD_API_CLIENT_ID }}
          ICD_API_CLIENT_SECRET: ${{ secrets.ICD_API_CLIENT_SECRET }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_TOKEN_ENCRYPTION_KEY: ${{ secrets.ZOHO_TOKEN_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail

          # Create a temporary directory inside the runner workspace for secret files
          secrets_dir="${RUNNER_TEMP}/secrets"
          mkdir -p "$secrets_dir"
          chmod 700 "$secrets_dir"

          required=(
            DATABASE_URL ICD_API_CLIENT_ID ICD_API_CLIENT_SECRET
            JWT_ACCESS_SECRET JWT_REFRESH_SECRET MINIO_ACCESS_KEY
            MINIO_ROOT_PASSWORD MINIO_ROOT_USER MINIO_SECRET_KEY
            POSTGRES_PASSWORD ZOHO_CLIENT_ID ZOHO_CLIENT_SECRET
            ZOHO_TOKEN_ENCRYPTION_KEY
          )

          # 2. Check each secret variable and write it to a file
          for name in "${required[@]}"; do
            # Fetch variable dynamically by name
            value="${!name}"

            if [[ -z "$value" ]]; then
              echo "Missing or empty production secret in GitHub Secrets: $name" >&2
              exit 1
            fi

            # Write secret to the temporary secrets folder
            printf '%s' "$value" > "$secrets_dir/$name"
            chmod 600 "$secrets_dir/$name"
          done

          # 3. Export secrets directory path for downstream steps
          echo "RAHO_SECRETS_DIR=$secrets_dir" >> "$GITHUB_ENV"
          echo "Successfully generated production secret files from GitHub Repository Secrets."

      - name: Build, back up, migrate, deploy, and verify
        shell: bash
        run: bash .github/scripts/deploy-production.sh
