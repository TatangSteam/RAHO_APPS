name: Deploy RAHO_APPS

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'
      - '.github/scripts/deploy-production.sh'
      - 'docker-compose.prod.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/api/Dockerfile'
      - 'apps/api/.dockerignore'
      - 'apps/api/entrypoint.sh'
      - 'apps/api/package.json'
      - 'apps/api/package-lock.json'
      - 'apps/api/prisma/**'
      - 'apps/api/scripts/**'
      - 'apps/api/src/**'
      - 'apps/api/tsconfig*.json'
      - 'apps/api/jest*.js'
      - 'apps/web/Dockerfile'
      - 'apps/web/.dockerignore'
      - 'apps/web/entrypoint.sh'
      - 'apps/web/package.json'
      - 'apps/web/package-lock.json'
      - 'apps/web/public/**'
      - 'apps/web/src/**'
      - 'apps/web/next.config.mjs'
      - 'apps/web/postcss.config.js'
      - 'apps/web/tailwind.config.ts'
      - 'apps/web/tsconfig.json'
      - 'apps/web/jest*.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          clean: true
          fetch-depth: 1
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Verify lockfiles and run tests
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"

          # Deployment must never create and push a second commit. If an app
          # lockfile is stale, fail and require the correction in a reviewed
          # commit instead.
          (cd apps/api && npm install --package-lock-only --ignore-scripts --no-workspaces)
          (cd apps/web && npm install --package-lock-only --ignore-scripts --no-workspaces)
          git diff --exit-code -- apps/api/package-lock.json apps/web/package-lock.json

          npm ci
          # A clean runner only has Prisma's placeholder client after npm ci.
          # Generate the schema-specific client before Jest, lint, and tsc load it.
          npm run db:generate --prefix apps/api
          npm run test:api
          npm run test:web
          npm run lint --prefix apps/api
          npm run lint --prefix apps/web
          npm run type-check:all

      - name: Verify production secret files
        shell: bash
        run: |
          set -euo pipefail

          secrets_dir="$HOME/RAHO_APPS/secrets"

          if [[ ! -d "$secrets_dir" ]]; then
            echo "Missing production secrets directory: $secrets_dir" >&2
            exit 1
          fi

          required=(
            DATABASE_URL ICD_API_CLIENT_ID ICD_API_CLIENT_SECRET
            JWT_ACCESS_SECRET JWT_REFRESH_SECRET MINIO_ACCESS_KEY
            MINIO_ROOT_PASSWORD MINIO_ROOT_USER MINIO_SECRET_KEY
            POSTGRES_PASSWORD ZOHO_CLIENT_ID ZOHO_CLIENT_SECRET
            ZOHO_TOKEN_ENCRYPTION_KEY
          )
          for name in "${required[@]}"; do
            if [[ ! -s "$secrets_dir/$name" ]]; then
              echo "Missing or empty production secret: $name" >&2
              exit 1
            fi
          done

          echo "RAHO_SECRETS_DIR=$secrets_dir" >> "$GITHUB_ENV"

      - name: Build, back up, migrate, deploy, and verify
        shell: bash
        run: bash .github/scripts/deploy-production.sh
