name: Deploy RAHO_APPS

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'
      - 'docker-compose.prod.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/api/Dockerfile'
      - 'apps/api/.dockerignore'
      - 'apps/api/entrypoint.sh'
      - 'apps/api/package.json'
      - 'apps/api/package-lock.json'
      - 'apps/api/prisma/**'
      - 'apps/api/scripts/**'
      - 'apps/api/src/**'
      - 'apps/api/tsconfig*.json'
      - 'apps/api/jest*.js'
      - 'apps/web/Dockerfile'
      - 'apps/web/.dockerignore'
      - 'apps/web/entrypoint.sh'
      - 'apps/web/package.json'
      - 'apps/web/package-lock.json'
      - 'apps/web/public/**'
      - 'apps/web/src/**'
      - 'apps/web/next.config.mjs'
      - 'apps/web/postcss.config.js'
      - 'apps/web/tailwind.config.ts'
      - 'apps/web/tsconfig.json'
      - 'apps/web/jest*.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          clean: true
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Sync secret files
        shell: bash
        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}"
          src="$HOME/RAHO_APPS/secrets"
          dst="${GITHUB_WORKSPACE}/secrets"

          if [[ ! -d "$src" ]]; then
            echo "Missing local secrets directory: $src" >&2
            exit 1
          fi

          mkdir -p "$dst"
          cp -a "$src/." "$dst/"

      - name: Detect manifest changes
        id: manifest_changes
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"

          if printf '%s\n' "$changed_files" | grep -Eq '^(package\.json|package-lock\.json|apps/api/package\.json|apps/api/package-lock\.json|apps/web/package\.json|apps/web/package-lock\.json)$'; then
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync app lockfiles
        id: sync_lockfiles
        if: steps.manifest_changes.outputs.should_sync == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"

          (cd apps/api && npm install --package-lock-only --ignore-scripts --no-workspaces)
          (cd apps/web && npm install --package-lock-only --ignore-scripts --no-workspaces)

          if git diff --quiet -- apps/api/package-lock.json apps/web/package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/package-lock.json apps/web/package-lock.json
          git commit -m "chore(ci): sync app lockfiles"
          git push origin HEAD:${GITHUB_REF_NAME}

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build and deploy
        if: steps.sync_lockfiles.outputs.changed != 'true'
        shell: bash
        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}"
          exec 9>/tmp/raho-deploy.lock
          flock -x 9
          trap 'flock -u 9 || true' EXIT

          docker system prune -a -f

          build_service() {
            service="$1"
            echo "Building ${service} image..."

            if ! docker compose -f docker-compose.prod.yml build --pull "$service"; then
              echo "${service} build failed, retrying with --no-cache..."
              docker compose -f docker-compose.prod.yml build --pull --no-cache "$service"
            fi
          }

          # Build sequentially to avoid API TypeScript and Next.js competing
          # for memory on the self-hosted deployment runner.
          build_service api
          build_service web

          docker compose -f docker-compose.prod.yml run --rm migrate
          docker compose -f docker-compose.prod.yml up -d api web
